name: "RFC 8441 CodeQL comparison"

on:
  push:
    branches: [rfc8441-codeql-audit]
  workflow_dispatch:

env:
  MAVEN_OPTS: -Xmx6g -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryhandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=240

permissions:
  contents: read

# Cancel running jobs when a new push happens to the same branch as otherwise it will
# tie up too many resources without providing much value.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.case }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - case: baseline
            revision: 516dd7ff8466c4295c8421ea3209eb6bf963d134
          - case: pr-merge
            revision: add6656de168257fb17592c00216008d76dd1eeb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: netty/netty
          ref: ${{ matrix.revision }}
          persist-credentials: false

      - name: Verify scanned revision
        env:
          EXPECTED: ${{ matrix.revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"

      # Pinned to v5.1.0
      - name: Cache local Maven repository
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: cache-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            cache-maven-${{ hashFiles('**/pom.xml') }}
            cache-maven-

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '11'

      # Pinned to v4.38.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          tools: linked
          build-mode: manual
          languages: java

      - name: Install tools / libraries
        run: sudo apt-get update && sudo apt-get -y install autoconf automake libtool make tar cmake perl ninja-build git cargo

      - name: Compile project
        run: ./mvnw -B -ntp clean package -DskipTests=true -DskipH3Spec=true

      # Pinned to v4.38.0
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/audit-sarif

      - name: Summarize the relevant findings without publishing SARIF
        env:
          RESULTS: ${{ runner.temp }}/audit-sarif
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          import hashlib
          import json
          import os
          import sys

          count = 0
          findings = []
          files = sorted(Path(os.environ["RESULTS"]).rglob("*.sarif"))
          if not files:
              sys.exit("No SARIF was generated")
          for file in files:
              for run in json.loads(file.read_text())["runs"]:
                  for result in run.get("results", []):
                      if result.get("ruleId") != "java/path-injection":
                          continue
                      count += 1
                      locations = result.get("locations", [])
                      if not locations:
                          continue
                      physical = locations[0].get("physicalLocation", {})
                      uri = unquote(physical.get("artifactLocation", {}).get("uri", ""))
                      if uri.split("/")[-1] != "AbstractDiskHttpData.java":
                          continue
                      line = physical.get("region", {}).get("startLine", 0)
                      fingerprints = result.get("partialFingerprints", {})
                      findings.append((line, fingerprints))
          print(f"Rule result count across Java scan: {count}")
          for line in (119, 124):
              matches = [f for l, f in findings if l == line]
              print(f"Reported line {line}: {len(matches)} matches")
          print(f"Matched file total: {len(findings)}")
          print(f"Findings with fingerprints: {sum(bool(f) for _, f in findings)}")
          digests = sorted(hashlib.sha256(json.dumps((line, fp), sort_keys=True).encode()).hexdigest()
                           for line, fp in findings if fp)
          print("Fingerprint-set digest: " + hashlib.sha256("\\n".join(digests).encode()).hexdigest())
          PY
